<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClaimCheck: opções</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <p class="brand">ClaimCheck</p>
        <h1>Configuração</h1>
        <p class="lede">
          O LLM extrai as afirmações e dá o veredito. A busca de evidências usa a API da
          Wikipedia e, opcionalmente, um buscador web. As chaves ficam só neste navegador
          (<code>chrome.storage.local</code>).
        </p>
      </header>

      <form id="settings-form" class="form">
        <label for="llm-provider">Provedor de LLM</label>
        <select id="llm-provider"></select>

        <label for="llm-key">API key do LLM</label>
        <input id="llm-key" type="password" autocomplete="off" spellcheck="false" placeholder="Cole sua API key aqui" />

        <label for="llm-model">Modelo</label>
        <input id="llm-model" type="text" autocomplete="off" spellcheck="false" />
        <p id="llm-hint" class="hint"></p>

        <label for="search-provider">Busca na web</label>
        <select id="search-provider"></select>

        <div id="search-key-row" class="form-row">
          <label for="search-key">API key da busca</label>
          <input id="search-key" type="password" autocomplete="off" spellcheck="false" />
        </div>
        <p id="search-hint" class="hint"></p>

        <label for="max-claims">Máximo de afirmações por página</label>
        <input id="max-claims" type="number" min="1" max="8" step="1" />

        <div class="actions">
          <button type="submit" class="btn primary">Salvar</button>
          <button type="button" id="toggle-visibility" class="btn ghost">Mostrar chaves</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
